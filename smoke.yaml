- hosts: all
  tasks:
    - name: Copy the exact source Zuul prepared to the node
      ansible.builtin.copy:
        src: '{{ zuul.executor.work_root }}/{{ zuul.project.src_dir }}/'
        dest: /home/zuul/smoke/
    - name: Remote test and main refusal, with logs retained on the node
      ansible.builtin.command:
        argv: [bash, /home/zuul/smoke/run.sh]
